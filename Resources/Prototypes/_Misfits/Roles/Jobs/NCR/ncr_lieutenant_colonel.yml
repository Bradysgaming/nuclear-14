# #Misfits Add - lieutenant colonel: admin-only NCR leadership role.

- type: job
  id: NCRLTCol
  setPreference: true
  whitelisted: true
  hideWithoutJobWhitelist: true
  jobWhitelistBypassesRoleTimers: true # bypass faction timelocks — admin-only
  alwaysUseSpawner: True
  weight: 135
  showBorder: true
  canBeAntag: false
  name: job-name-lieutenant-colonel
  overwatchCategory: OverwatchNcrOfficers
  description: job-description-ltcol
  playTimeTracker: NCRLTCol
  startingGear: NCRLTColGear
  icon: "JobIconNcrLeader"
  supervisors: job-supervisors-ncr-ltcol
  requireAdminNotify: true
  hideIfPlaytimeRequirementsNotMet: false
  accessGroups:
    - NCR
    - NCRSGT
    - NCRMedic
    - NCRLT
    - NCRCaptain
    - NCRMajor
    - NCRRanger
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
        - Human
        - Ghoul
    - !type:CharacterDepartmentTimeRequirement
      department: NCR
      min: 252000 # 70 hours
  special:
    - !type:AddComponentSpecial
      components:
        - type: NpcFactionMember
          factions:
            - NCR

- type: startingGear
  id: NCRLTColGear
  equipment:
    wallet: N14Wallet
    back: N14ClothingBackpackNCR
    jumpsuit: N14ClothingOfficerUniformNCRDesert
    shoes: N14ClothingBootsCombatFilled
    id: N14NCRLieutenantColonelPipboy
  innerClothingSkirt: N14ClothingOfficerUniformNCRDesert
- type: playTimeTracker
  id: NCRLTCol
