# #Misfits Add - Paracusia trait. Grants ParacusiaComponent which feeds into
# HallucinationsSystem to produce time-scaled auditory hallucinations.
# Costs 2 trait points (mental category) since it's flavor-only — no real harm.

- type: trait
  id: TraitParacusia
  category: Mental
  points: 2
  functions:
  - !type:TraitAddComponent
    components:
    - type: MisfitsParacusia


# This is the auditory version of the Paracusia.
# It produces sounds at randomized intervals.
# Can make it hard to differentiate what is real and what is not.

- type: trait
  id: TraitParacusiaAuditory
  category: Auditory
  points: 2
  functions:
  - !type:TraitAddComponent
    components:
    - type: Paracusia
