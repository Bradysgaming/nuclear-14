  hide: false
  icon:
    sprite: _Nuclear14/Objects/Specific/Medical/drugs.rsi
    state: healingpowder
  objectType: Item

# ============================================================================
# CONSTRUCTION GRAPHS
# ============================================================================

# Field-medic Glowing Blood Pack.
# The normal Bloodpack already carries the Bloodpack crafting tag.
# MisfitsEthanolBottle specifically targets the N14 medical ethanol bottle.
- type: constructionGraph
  id: MisfitsGlowingBloodPack
  start: start
  graph:
  - node: start
    edges:
    - to: glowingbloodpack
      steps:
      - tag: Bloodpack
        name: blood pack
        icon:
          sprite: Objects/Specific/Medical/medical.rsi
          state: bloodpack
      - material: CaveFungusRad
        amount: 2
      - tag: MisfitsEthanolBottle
        name: ethanol bottle
        icon:
          sprite: _Nuclear14/Objects/Specific/Medical/drugs.rsi
          state: ethanol
        doAfter: 5
  - node: glowingbloodpack
    entity: MisfitsGlowingBloodPack

# Fallout 4-inspired preventative herbal medicine.
- type: constructionGraph
  id: MisfitsHerbalAnodyne
  start: start
  graph:
  - node: start
    edges:
    - to: herbalanodyne
      steps:
      - material: WildCarrot
        amount: 2
      - material: CaveFungusRad
      - material: Nettles
        amount: 2
      - material: WildRazorgrain
        doAfter: 4
  - node: herbalanodyne
    entity: MisfitsHerbalAnodyne

- type: constructionGraph
  id: MisfitsHerbalAntimicrobial
  start: start
  graph:
  - node: start
    edges:
    - to: herbalantimicrobial
      steps:
      - material: WildCarrot
      - material: CaveFungusRad
      - material: WildBuffaloGourd
        amount: 2
      - material: Nettles
        doAfter: 4
  - node: herbalantimicrobial
    entity: MisfitsHerbalAntimicrobial

- type: constructionGraph
  id: MisfitsHerbalStimulant
  start: start
  graph:
  - node: start
    edges:
    - to: herbalstimulant
      steps:
      - material: CaveFungusRad
      - material: WildBuffaloGourd
      - material: Nettles
      - material: WildRazorgrain
        amount: 2
        doAfter: 4
  - node: herbalstimulant
    entity: MisfitsHerbalStimulant
