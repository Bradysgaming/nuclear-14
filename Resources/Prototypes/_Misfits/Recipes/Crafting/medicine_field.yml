# ============================================================================
# CRAFTED MEDICINE ITEMS
# ============================================================================

# Uses the working RadAway bloodbag injector as its functional base, then swaps
# the contained reagent to MisfitsGlowingBloodPack.
- type: entity
  parent: N14RadAwayBloodbag
  id: MisfitsGlowingBloodPack
  name: glowing blood pack
  description: A blood pack treated with irradiated fungus and medical alcohol. It emits a faint, unhealthy glow.
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsGlowingBloodPack
          Quantity: 10
  - type: Hypospray
    solutionName: pen
    transferAmount: 10
  - type: Construction
    graph: MisfitsGlowingBloodPack
    node: glowingbloodpack

- type: entity
  parent: N14HealingPowder
  id: MisfitsHerbalAnodyne
  name: herbal anodyne
  description: A pouch of bitter medicinal plants prepared to dull persistent pain and exhaustion.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsHerbalAnodyne
          Quantity: 10
  - type: Construction
    graph: MisfitsHerbalAnodyne
    node: herbalanodyne

- type: entity
  parent: N14HealingPowder
  id: MisfitsHerbalAntimicrobial
  name: herbal antimicrobial
  description: A pungent mixture of wasteland herbs traditionally used against infection and contaminated wounds.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsHerbalAntimicrobial
          Quantity: 10
  - type: Construction
    graph: MisfitsHerbalAntimicrobial
    node: herbalantimicrobial

- type: entity
  parent: N14HealingPowder
  id: MisfitsHerbalStimulant
  name: herbal stimulant
  description: A sharp herbal mixture prepared to keep an exhausted traveler awake and moving.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsHerbalStimulant
          Quantity: 10
  - type: Construction
    graph: MisfitsHerbalStimulant
    node: herbalstimulant

# ============================================================================
