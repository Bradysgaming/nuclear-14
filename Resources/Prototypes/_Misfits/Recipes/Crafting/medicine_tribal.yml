# ============================================================================
# CONSTRUCTION GRAPHS
# ============================================================================

- type: constructionGraph
  id: MisfitsDaturaHide
  start: start
  graph:
  - node: start
    edges:
    - to: daturahide
      steps:
      - material: DaturaFlower
        amount: 4
      - tag: WonderGlue
        name: Wonderglue
        icon:
          sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
          state: wonderglue
        doAfter: 3
  - node: daturahide
    entity: MisfitsDaturaHide

- type: constructionGraph
  id: MisfitsSnakebiteTourniquet
  start: start
  graph:
  - node: start
    edges:
    - to: snakebitetourniquet
      steps:
      - material: WildBuffaloGourd
        amount: 2
      - material: Cloth
        amount: 1
        doAfter: 2
  - node: snakebitetourniquet
    entity: MisfitsSnakebiteTourniquet

# A medical ethanol bottle can replace vodka.
# using generic Bottle here would allow unrelated drink bottles.
- type: constructionGraph
  id: MisfitsFieryPurgative
  start: start
  graph:
  - node: start
    edges:
    # Original wasteland route.
    - to: fierypurgative
      steps:
      - tag: Vodka
        name: vodka
        icon:
          sprite: Objects/Consumable/Drinks/vodkabottle.rsi
          state: icon
      - material: WildGlowpepper
      - material: WildWhiteHorsenettle
        doAfter: 4
  - node: fierypurgative
    entity: MisfitsFieryPurgative

# A medical ethanol bottle can replace vodka.
# using generic Bottle here would allow unrelated drink bottles.
- type: constructionGraph
  id: MisfitsFieryPurgative
  start: start
  graph:
