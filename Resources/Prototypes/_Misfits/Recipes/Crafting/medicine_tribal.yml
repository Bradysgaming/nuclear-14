# ============================================================================
# CRAFTED MEDICINE ITEMS
# ============================================================================

- type: entity
  parent: N14HealingPowder
  id: MisfitsDaturaHide
  name: datura hide
  description: A thick datura ointment rubbed over the skin to dull pain and harden it against injury.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsDaturaHide
          Quantity: 10
  - type: Construction
    graph: MisfitsDaturaHide
    node: daturahide

- type: entity
  parent: N14HealingPowder
  id: MisfitsSnakebiteTourniquet
  name: snakebite tourniquet
  description: A strip of binding packed with ground buffalo gourd, carried for venomous bites and stings.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medical.rsi
    state: tourniquet
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: MisfitsSnakebiteTourniquet
          Quantity: 5
  - type: Construction
    graph: MisfitsSnakebiteTourniquet
    node: snakebitetourniquet

- type: entity
  parent: N14HealingPowder
  id: MisfitsFieryPurgative
  name: fiery purgative
  description: A viciously hot herbal purge used to flush venom and radiation from the body.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsFieryPurgative
          Quantity: 10
  - type: Construction
    graph: MisfitsFieryPurgative
    node: fierypurgative

- type: entity
  parent: N14HealingPowder
  id: MisfitsBloodShield
  name: blood shield
  description: A bitter Zion-style herbal mash used to strengthen the body against poison.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsBloodShield
          Quantity: 10
  - type: Construction
    graph: MisfitsBloodShield
    node: bloodshield

- type: entity
  parent: N14HealingPowder
  id: MisfitsPilgrimsRemedy
  name: pilgrim's remedy
  description: A mild wasteland mixture of medicinal roots, fungus and agave intended for long journeys.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: MisfitsPilgrimsRemedy
          Quantity: 15
  - type: Construction
    graph: MisfitsPilgrimsRemedy
    node: pilgrimsremedy

- type: entity
  parent: N14HealingPowder
  id: MisfitsHealingSalve
  name: healing salve
  description: A sticky herbal salve for cuts, burns and other ordinary wasteland injuries.
  components:
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsHealingSalve
          Quantity: 10
  - type: Construction
    graph: MisfitsHealingSalve
    node: healingsalve

- type: entity
  parent: N14HealingPowder
  id: MisfitsGravesalt
  name: gravesalt
  description: A harsh pouch of ash, bitter herbs and mineral-rich plant matter used as an emergency poison purge.
  components:
